name: Swiss P Map CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy ruff
      - name: Lint (ruff)
        run: |
          ruff check src tests || echo "ruff: no src yet or warnings - non-blocking"
      - name: Type check (mypy)
        run: |
          mypy src tests --ignore-missing-imports || echo "mypy: no src yet or warnings - non-blocking"
      - name: Run pytest
        run: pytest -v
